name: Release IPA

# Builds kenni for iOS and publishes an installable .ipa to a GitHub Release
# whenever a version tag like v1.0.2 is pushed.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app

      - name: Check signing secrets
        run: |
          if [[ -z "$BUILD_CERTIFICATE_BASE64" || -z "$BUILD_PROVISION_PROFILE_BASE64" ]]; then
            echo "::error::Missing Apple signing secrets (BUILD_CERTIFICATE_BASE64, P12_PASSWORD, BUILD_PROVISION_PROFILE_BASE64, KEYCHAIN_PASSWORD). See the Releases section of README.md."
            exit 1
          fi

      - name: Import Apple signing certificate
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/kenni_signing.p12"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

          KEYCHAIN_PATH="$RUNNER_TEMP/kenni-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/kenni.mobileprovision"

      - name: Resolve version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Built kenni ${VERSION} from ${GITHUB_REF_NAME}"

      - name: Archive app
        run: |
          xcodebuild archive \
            -project kenni/kenni.xcodeproj \
            -scheme kenni \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/kenni" \
            -derivedDataPath "$RUNNER_TEMP/kenni-derived" \
            MARKETING_VERSION=${{ steps.version.outputs.version }}

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/kenni.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist .github/ExportOptions.plist
          mv "$RUNNER_TEMP/export/kenni.ipa" "kenni-${{ steps.version.outputs.version }}.ipa"
          shasum -a 256 "kenni-${{ steps.version.outputs.version }}.ipa"

      - name: Create GitHub release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          [[ "$VERSION" == *-* ]] && PRERELEASE="--prerelease"
          gh release create "$TAG" "kenni-$VERSION.ipa" \
            --title "kenni $VERSION" \
            --notes "Built from $GITHUB_SHA via \`$TAG\`." \
            $PRERELEASE

      - name: Clean up keychain
        if: ${{ always() }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/kenni-signing.keychain-db"
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/kenni.mobileprovision"